# Publishes the Ubuntu 26 DL Streamer runtime image that oversiteai-streaming's
# Dockerfile.intel builds FROM. Fires on any oai/* tag. The image tag is derived,
# not taken from the git tag: <upstream tag>-ov<OpenVINO>-<fork sha7>, so a tag
# names one build and is never re-pushed (the job refuses if it already exists).
# One build, two tags: <tag> = hub image (debug info stripped, 165 MB smaller),
# <tag>-dbg = same build with symbols, for the harness and crash triage.
name: Publish ghcr.io/secretzer0/dlstreamer

on:
  push:
    tags: ["oai/*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/secretzer0/dlstreamer
  DOCKERFILE: docker/ubuntu/ubuntu26-dbg.Dockerfile

jobs:
  build:
    # GitHub-hosted: 4 vCPU, 60-90 min. Rare, accepted (H 2026-10-25).
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Derive the image tag
        id: meta
        run: |
          set -euo pipefail
          UPSTREAM=$(git describe --tags --match '20[0-9][0-9].*' --abbrev=0 HEAD)
          OV=$(sed -n 's/^ARG OPENVINO_VERSION=\(.*\)$/\1/p' "$DOCKERFILE" | head -1)
          SHA7=${GITHUB_SHA::7}
          TAG="${UPSTREAM}-ov${OV}-${SHA7}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "upstream=${UPSTREAM}" >> "$GITHUB_OUTPUT"
          echo "ov=${OV}" >> "$GITHUB_OUTPUT"
          echo "image tag: ${TAG}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to re-push an existing tag
        run: |
          set -euo pipefail
          if docker manifest inspect "${IMAGE}:${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${{ steps.meta.outputs.tag }} already exists; tags are immutable"
            exit 1
          fi

      - name: Build and push hub (stripped) and -dbg
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          LABELS=(
            --label "org.opencontainers.image.source=https://github.com/secretzer0/dlstreamer"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "ai.oversite.dlstreamer.upstream_tag=${{ steps.meta.outputs.upstream }}"
            --label "ai.oversite.openvino=${{ steps.meta.outputs.ov }}"
          )
          for variant in dbg hub; do
            case $variant in
              dbg) STRIP=0; SUFFIX=-dbg ;;
              hub) STRIP=1; SUFFIX= ;;
            esac
            docker buildx build \
              --platform linux/amd64 \
              --file "$DOCKERFILE" \
              --target dlstreamer \
              --build-arg DLSTREAMER_BUILD_NUMBER="${TAG}" \
              --build-arg STRIP_DEBUG="${STRIP}" \
              "${LABELS[@]}" \
              --label "ai.oversite.variant=${variant}" \
              --provenance=false \
              --tag "${IMAGE}:${TAG}${SUFFIX}" \
              --push \
              .
          done

      - name: Summary
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          {
            echo "Pushed:"
            for SUFFIX in "" -dbg; do
              DIGEST=$(docker manifest inspect -v "${IMAGE}:${TAG}${SUFFIX}" | jq -r '.Descriptor.digest')
              SIZE=$(docker manifest inspect "${IMAGE}:${TAG}${SUFFIX}" | jq '[.layers[].size] | add / 1048576 | floor')
              echo "- \`${IMAGE}:${TAG}${SUFFIX}@${DIGEST}\` (${SIZE} MB compressed)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
