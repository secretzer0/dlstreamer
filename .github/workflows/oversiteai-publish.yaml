# Publishes the Ubuntu 26 debug-symbol DL Streamer runtime image that
# oversiteai-streaming's Dockerfile.intel builds FROM. Fires on an oai/* tag;
# the image tag is the git tag without the oai/ prefix.
name: Publish ghcr.io/secretzer0/dlstreamer

on:
  push:
    tags: ["oai/*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/secretzer0/dlstreamer

jobs:
  build:
    # GitHub-hosted: 4 vCPU, ~14 GB free disk before cleanup. Expect 60-90 min.
    # A self-hosted runner registered on this fork (label: dlstreamer) is faster.
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Image tag from git tag
        id: meta
        run: |
          set -euo pipefail
          echo "tag=${GITHUB_REF_NAME#oai/}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --file docker/ubuntu/ubuntu26-dbg.Dockerfile \
            --target dlstreamer \
            --build-arg DLSTREAMER_BUILD_NUMBER="${{ steps.meta.outputs.tag }}" \
            --label org.opencontainers.image.source=https://github.com/secretzer0/dlstreamer \
            --provenance=false \
            --tag "${IMAGE}:${{ steps.meta.outputs.tag }}" \
            --push \
            .

      - name: Summary
        run: echo "Pushed \`${IMAGE}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
