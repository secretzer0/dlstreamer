# Publishes the Ubuntu 26 DL Streamer runtime image (Release build with debug
# symbols kept) that oversiteai-streaming's Dockerfile.intel builds FROM.
# Fires on an oai/* tag; the image tag is the git tag without the prefix, in
# Intel's weekly form: oai/2026.3-20261025 -> :2026.3-20261025. A tag names
# one build and is never re-pushed (the job refuses if it already exists).
name: Publish ghcr.io/secretzer0/dlstreamer

on:
  push:
    tags: ["oai/*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/secretzer0/dlstreamer
  DOCKERFILE: docker/ubuntu/ubuntu26-dbg.Dockerfile

jobs:
  build:
    # GitHub-hosted: 4 vCPU, 60-90 min. Rare, accepted (H 2026-10-25).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Image tag from git tag
        id: meta
        run: |
          set -euo pipefail
          echo "tag=${GITHUB_REF_NAME#oai/}" >> "$GITHUB_OUTPUT"
          echo "upstream=$(git describe --tags --match '20[0-9][0-9].*' --abbrev=0 HEAD)" >> "$GITHUB_OUTPUT"
          echo "ov=$(sed -n 's/^ARG OPENVINO_VERSION=\(.*\)$/\1/p' "$DOCKERFILE" | head -1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to re-push an existing tag
        run: |
          set -euo pipefail
          if docker manifest inspect "${IMAGE}:${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${{ steps.meta.outputs.tag }} already exists; tags are immutable"
            exit 1
          fi

      - name: Build and push
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --file "$DOCKERFILE" \
            --target dlstreamer \
            --build-arg DLSTREAMER_BUILD_NUMBER="${{ steps.meta.outputs.tag }}" \
            --label org.opencontainers.image.source=https://github.com/secretzer0/dlstreamer \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label ai.oversite.dlstreamer.upstream_tag="${{ steps.meta.outputs.upstream }}" \
            --label ai.oversite.openvino="${{ steps.meta.outputs.ov }}" \
            --provenance=false \
            --tag "${IMAGE}:${{ steps.meta.outputs.tag }}" \
            --push \
            .

      - name: Summary
        run: |
          set -euo pipefail
          DIGEST=$(docker manifest inspect -v "${IMAGE}:${{ steps.meta.outputs.tag }}" | jq -r '.Descriptor.digest')
          echo "Pushed \`${IMAGE}:${{ steps.meta.outputs.tag }}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
